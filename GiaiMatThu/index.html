<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Decoder - Giải & Mã Hóa Mật Thư</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header-area">
            <div class="logo-box">
                <img src="https://cdn.haitrieu.com/wp-content/uploads/2022/07/logo-thieu-nhi-thanh-the-1024x1024.png"
                    alt="Logo TNTT">
            </div>
            <h1>Mật Thư Công Giáo</h1>
        </div>

        <div class="form-group">
            <label>Loại mật thư:</label>
            <select id="cipherType" class="form-control">
                <option value="chu-the-chu">Chữ thế chữ</option>
                <option value="chu-the-so">Chữ thế số</option>
                <option value="bang-tra">Bảng tra (Morse/Chuồng bò/Chuồng bồ câu)</option>
                <option value="toa-do">Tọa độ</option>
                <option value="mua-roi">Mưa rơi</option>
                <option value="xoan-oc">Xoắn ốc (Từ trong ra hoặc Từ ngoài vào)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Key:</label>
            <input type="text" id="cipherKey" class="form-control" placeholder="Nhập khóa vào đây...">
        </div>

        <div class="form-group">
            <label>Văn bản:</label>
            <textarea id="inputText" class="form-control" placeholder="Nhập nội dung cần xử lý..."></textarea>
        </div>

        <div class="button-group">
            <button id="btnEncrypt" class="btn btn-encrypt">🔒 Mã Hóa</button>
            <button id="btnDecrypt" class="btn btn-decrypt">🔓 Giải Mã</button>
        </div>

        <div class="output-area">
            <label>Kết quả:</label>
            <textarea id="outputText" class="output-box" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
